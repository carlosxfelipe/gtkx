packages:
  - .
  - packages/*
  - packages/native/npm/*
  - examples/*
  - website

minimumReleaseAge: 0

allowBuilds:
  '@swc/core': true
  esbuild: true

onlyBuiltDependencies:
  - "@swc/core"
  - core-js
  - core-js-pure
  - esbuild

patchedDependencies:
  typescript@6.0.3: patches/typescript@6.0.3.patch

overrides:
  '@docsearch/css': ^3.9.0
  '@docsearch/js': ^3.9.0
  '@docsearch/react': ^3.9.0
