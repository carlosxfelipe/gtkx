version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/examples/tutorial"
    schedule:
      interval: "daily"
  - package-ecosystem: "cargo"
    directory: "/packages/native"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/.github/docker"
    schedule:
      interval: "daily"
